version: "3.8"

services:
  app:
    build: .
    container_name: fullstackContainer
    ports:
      - "3000:3000"
      - "35729:35729"
    volumes:
      - type: volume
        source: logs
        target: /app/public/logs
      - type: bind
        source: /Users/manikbajaj/Business/apps/fullstack-server-rendering/
        target: /app
      - /app/node_modules # Anonymous volume for node_modules
    environment:
      - NODE_ENV=development
    env_file:
      - ./.env

  db:
    image: postgres
    container_name: dockerpostgres
    env_file:
      - ./.env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    #/var/lib/postgresql/data is the directory inside the PostgreSQL container where PostgreSQL naturally stores its data. By mounting the postgres_data volume at this path, all data handled by PostgreSQL is written to the volume, thereby benefiting from persistence, performance, and manageability.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  logs:
  postgres_data:
